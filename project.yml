# XcodeGen spec for the NDI Monitor iPad app.
#
# Generate the Xcode project with:
#     brew install xcodegen   # once
#     xcodegen generate
#     open NDIMonitor.xcodeproj
#
# The project file itself is git-ignored so it can be regenerated cleanly.

name: NDIMonitor

options:
  bundleIdPrefix: com.webpresenter
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"   # iPad
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Build against the real NDI SDK (static libndi_ios.a). The NDISDK module is
    # wired up below; see docs/NDI_SDK_INTEGRATION.md.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: USE_REAL_NDI

targets:
  NDIMonitor:
    type: application
    platform: iOS
    sources:
      - path: NDIMonitor
    info:
      path: NDIMonitor/Resources/Info.plist
      properties:
        CFBundleDisplayName: NDI Monitor
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # Required for NDI's mDNS/Bonjour discovery on iOS 14+.
        NSLocalNetworkUsageDescription: Used to discover NDI video sources on your local network.
        NSBonjourServices:
          - _ndi._tcp
    dependencies:
      # Static NDI library (Vendor/NDI/libndi_ios.a). Not embedded (static).
      - framework: Vendor/NDI/libndi_ios.a
        embed: false
      # System frameworks the NDI SDK depends on.
      - sdk: VideoToolbox.framework
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webpresenter.ndimonitor
        # --- NDI SDK wiring ---
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Vendor/NDI"          # finds module.modulemap
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/NDI/include"  # NDI headers
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Vendor/NDI"         # libndi_ios.a location
        OTHER_LDFLAGS: "-lc++"                                # NDI is C++ underneath

  NDIMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NDIMonitorTests
    dependencies:
      - target: NDIMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webpresenter.ndimonitor.tests
