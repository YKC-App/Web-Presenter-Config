<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1C30"/>
      <stop offset="100%" stop-color="#070F1C"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13223A"/>
      <stop offset="100%" stop-color="#0C1826"/>
    </linearGradient>
    <linearGradient id="scope_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle grid overlay -->
  <line x1="512" y1="56" x2="512" y2="968" stroke="#1A2E48" stroke-width="4" opacity="0.8"/>
  <line x1="56" y1="512" x2="968" y2="512" stroke="#1A2E48" stroke-width="4" opacity="0.8"/>

  <!-- 4 screen tiles -->
  <rect x="66" y="66" width="418" height="418" rx="18" fill="url(#tile)" stroke="#1E3354" stroke-width="3"/>
  <rect x="540" y="66" width="418" height="418" rx="18" fill="url(#tile)" stroke="#1E3354" stroke-width="3"/>
  <rect x="66" y="540" width="418" height="418" rx="18" fill="url(#tile)" stroke="#1E3354" stroke-width="3"/>
  <rect x="540" y="540" width="418" height="418" rx="18" fill="url(#tile)" stroke="#1E3354" stroke-width="3"/>

  <!-- Video content lines (top-left tile) -->
  <rect x="96" y="170" width="200" height="10" rx="5" fill="#1E3A60" opacity="0.9"/>
  <rect x="96" y="192" width="140" height="10" rx="5" fill="#1A3050" opacity="0.7"/>
  <rect x="96" y="214" width="170" height="10" rx="5" fill="#1A3050" opacity="0.5"/>

  <!-- Active tracking box on top-left tile (green corners) -->
  <rect x="96" y="140" width="360" height="312" rx="6" fill="none" stroke="#00DD88" stroke-width="4" stroke-dasharray="8 4" opacity="0.7"/>
  <path d="M 96 140 h 40 M 96 140 v 40" stroke="#00FF99" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 456 140 h -40 M 456 140 v 40" stroke="#00FF99" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 96 452 h 40 M 96 452 v -40" stroke="#00FF99" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 456 452 h -40 M 456 452 v -40" stroke="#00FF99" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- LIVE (TALLY) indicator on top-right tile -->
  <circle cx="934" cy="104" r="24" fill="#FF2222" opacity="0.95"/>
  <text x="934" y="111" text-anchor="middle" fill="white" font-size="20" font-family="system-ui,sans-serif" font-weight="800">L</text>

  <!-- Signal bars (bottom-left tile) -->
  <rect x="110" y="700" width="30" height="80" rx="6" fill="#1E5080" opacity="0.7"/>
  <rect x="154" y="660" width="30" height="120" rx="6" fill="#1E6090" opacity="0.8"/>
  <rect x="198" y="620" width="30" height="160" rx="6" fill="#00A0CC" opacity="0.9"/>
  <rect x="242" y="580" width="30" height="200" rx="6" fill="#00B4FF"/>
  <rect x="286" y="600" width="30" height="180" rx="6" fill="#00B4FF"/>
  <rect x="330" y="640" width="30" height="140" rx="6" fill="#0090CC" opacity="0.9"/>
  <text x="200" y="878" fill="#2A5070" font-size="36" font-family="system-ui,sans-serif" font-weight="600">NDI SIGNAL</text>

  <!-- PTZ scope / crosshair (bottom-right tile) -->
  <!-- Outer dashed ring -->
  <circle cx="750" cy="750" r="148" fill="none" stroke="#1E4A6A" stroke-width="4" stroke-dasharray="12 8" filter="url(#glow)" opacity="0.6"/>
  <!-- Main ring -->
  <circle cx="750" cy="750" r="112" fill="none" stroke="url(#scope_grad)" stroke-width="7" filter="url(#glow)" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="750" cy="750" r="60" fill="none" stroke="#00B4FF" stroke-width="5" opacity="0.85"/>
  <!-- Center dot -->
  <circle cx="750" cy="750" r="16" fill="url(#scope_grad)"/>
  <!-- Crosshair lines -->
  <line x1="750" y1="596" x2="750" y2="682" stroke="#00B4FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="750" y1="818" x2="750" y2="904" stroke="#00B4FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="596" y1="750" x2="682" y2="750" stroke="#00B4FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <line x1="818" y1="750" x2="904" y2="750" stroke="#00B4FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
